app = "jm-music-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Correção P0: Roda as migrações do Prisma automaticamente antes de liberar tráfego
[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1