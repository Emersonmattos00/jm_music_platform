services:
  postgres:
    image: postgres:17
    container_name: jm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jm_music
      POSTGRES_USER: jm
      POSTGRES_PASSWORD: jm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jm -d jm_music"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: jm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: